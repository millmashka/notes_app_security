name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем bandit и pytest (pytest если нужно запускать тесты)
          pip install bandit pytest

      - name: Run Bandit (Security Check) excluding venv and sqlmap
        run: |
          # Исключаем venv/виртуальное окружение и папку sqlmap (сторонний инструмент)
          # -r .        : рекурсивно по текущей директории
          # -x "..."    : исключаем перечисленные пути (через запятую)
          # -lll        : подробный лог
          # -f json -o result.json : сохраняем результат в JSON
          bandit -r . -x "venv,venv/*,sqlmap,sqlmap/*" -lll -f json -o result.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-result
          path: result.json

      - name: Fail on High Severity Issues (only within scanned scope)
        run: |
          # Если в result.json есть high, то workflow упадёт
          if grep -q '"issue_severity": "HIGH"' result.json; then
            echo "High severity issues found!"
            exit 1
          fi

      - name: Run Pytest
        run: |
          # Запуск unit-тестов (если есть)
          pytest || true
