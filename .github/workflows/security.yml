name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit pytest jq

      - name: Run Bandit (Security Check)
        run: |
          # Исключаем стороннюю папку sqlmap, которая даёт много ложных/ожидаемых предупреждений
          bandit -r . -lll --exclude sqlmap/sqlmap-master

      - name: Fail on High Severity Issues
        run: |
          bandit -r . -lll -f json -o result.json --exclude sqlmap/sqlmap-master
          if jq '.results[] | select(.issue_severity=="HIGH")' result.json | grep -q '.'; then
            echo "High severity issues found!"
            cat result.json
            exit 1
          fi

      - name: Run Pytest
        run: pytest
