name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      # Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v3

      # Настройка Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Установка Bandit
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      # Запуск Bandit только на твоих файлах
      - name: Run Bandit (Security Check)
        run: |
          bandit form.py app.py -lll -f json -o result.json || true

      # Загрузка отчёта
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-result
          path: result.json

      # Блокировка merge при High severity
      - name: Fail on High Severity Issues
        run: |
          if grep -q '"issue_severity": "HIGH"' result.json; then
            echo "❌ High severity security issues found! Blocking merge."
            exit 1
          else
            echo "✅ No high severity issues."
          fi

      # Проверка debug=True
      - name: Check for unsafe debug mode
        run: |
          if grep -R --include="*.py" "debug=True" .; then
            echo "❌ Security Alert: debug mode enabled in code!"
            exit 1
          else
            echo "✅ No debug=True found in Python code."
          fi
