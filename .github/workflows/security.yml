name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit (only project files)
        run: |
          # Проверяем только form.py и app.py
          bandit form.py app.py -lll -f json -o result.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-result
          path: result.json

      - name: Fail on High Severity Issues
        run: |
          if [ -f result.json ] && grep -q '"issue_severity": "HIGH"' result.json; then
            echo "❌ High severity security issues found in scanned files! Blocking merge."
            # Печатаем краткий фрагмент для быстрого просмотра
            grep -n '"issue_severity": "HIGH"' result.json || true
            exit 1
          else
            echo "✅ No high severity issues in scanned files."
          fi

      - name: Check for unsafe debug mode (only project files)
        run: |
          # Ищем debug=True только в form.py и app.py
          if grep -q "debug=True" form.py app.py 2>/dev/null; then
            echo "❌ Security Alert: debug=True found in project files! Blocking merge."
            # Показать, в каком файле найдено
            grep -n "debug=True" form.py app.py || true
            exit 1
          else
            echo "✅ No debug=True found in form.py and app.py."
          fi
