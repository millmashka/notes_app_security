name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt bandit pytest

      - name: Run Bandit (Security Check) excluding sqlmap
        run: |
          # Исключаем папку sqlmap, чтобы не падало на стороннем коде
          bandit -r . -x "sqlmap,sqlmap/*" -lll -f json -o result.json || true

      - name: Fail on High Severity Issues
        run: |
          if grep -q '"issue_severity": "HIGH"' result.json; then
            echo "High severity issues found!"
            exit 1
          fi

      - name: Run Pytest
        run: pytest
