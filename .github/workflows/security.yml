name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pytest

      - name: Run Bandit (Security Check) excluding venv and sqlmap
        run: |
          bandit -r . -x "venv,venv/*,sqlmap,sqlmap/*" -lll -f json -o result.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-result
          path: result.json

      - name: Display High Severity Issues (do not fail workflow)
        run: |
          echo "High severity issues (if any) in scanned scope:"
          grep '"issue_severity": "HIGH"' result.json || echo "None"

      - name: Check for unsafe debug mode
        run: |
          # Ищем debug=True, но исключаем большие или сторонние директории,
          # которые создают "шум" (venv, sqlmap).
          if grep -R --line-number --exclude-dir=venv --exclude-dir=sqlmap "debug=True" .; then
            echo "❌ Security Alert: debug mode enabled in repository (excluded venv/sqlmap)!"
            exit 1
          fi
      - name: Run Pytest
        run: |
          pytest || true

